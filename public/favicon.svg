<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0052FF" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Logo Container -->
  <rect width="512" height="512" rx="112" fill="url(#navyGrad)" />

  <!-- Outer B Shape / Folded Document Frame -->
  <g transform="translate(100, 76)" filter="url(#shadow)">
    <!-- Main B / Document outline -->
    <path d="M 40 20 L 200 20 C 250 20, 280 50, 280 95 C 280 130, 255 155, 220 165 C 265 175, 295 210, 295 255 C 295 310, 255 340, 190 340 L 40 340 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Folded paper top right inner corner -->
    <path d="M 180 20 L 180 70 L 230 70" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="24" 
          stroke-linejoin="round" />

    <!-- Invoice Lines inside document -->
    <line x1="90" y1="110" x2="180" y2="110" stroke="#00D2FF" stroke-width="18" stroke-linecap="round" />
    <line x1="90" y1="155" x2="210" y2="155" stroke="#80B3FF" stroke-width="14" stroke-linecap="round" />
    <line x1="90" y1="195" x2="170" y2="195" stroke="#80B3FF" stroke-width="14" stroke-linecap="round" />

    <!-- Invoice Table Box Mockup -->
    <rect x="90" y="235" width="130" height="60" rx="8" fill="none" stroke="#FFFFFF" stroke-width="10" />
    <line x1="90" y1="260" x2="220" y2="260" stroke="#FFFFFF" stroke-width="8" />
    <line x1="150" y1="235" x2="150" y2="295" stroke="#FFFFFF" stroke-width="8" />

    <!-- Sleek Q Loop / Swoosh -->
    <path d="M 200 240 C 250 240, 290 280, 290 330 C 290 380, 250 415, 200 415 C 150 415, 110 380, 110 330 C 110 280, 150 240, 200 240 Z" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="36" />
    
    <!-- Q Accent Tail -->
    <path d="M 230 360 L 310 430" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="36" 
          stroke-linecap="round" />
  </g>
</svg>
